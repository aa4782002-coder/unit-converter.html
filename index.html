<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Unit Converter Pro</title>
    <style>
        /* Modern, Clean US-Themed Styles */
        :root {
            --us-blue: #0A3161;
            --us-red: #B31942;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        /* Visitor Counter */
        .visitor-counter {
            position: absolute;
            top: 15px;
            right: 20px;
            background-color: var(--us-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--us-blue);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            margin-top: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--us-red);
        }

        .card h3 {
            margin-top: 0;
            color: var(--us-blue);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .swap-btn {
            background-color: #eee;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--us-blue);
            transition: 0.2s;
        }

        .swap-btn:hover {
            background-color: var(--us-blue);
            color: white;
        }

        .result-display {
            background-color: #e9f0f8;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--us-blue);
            margin-bottom: 15px;
            min-height: 28px;
        }

        .conversion-rate {
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            background: #fff8e1;
            padding: 8px;
            border-radius: 4px;
            border: 1px dashed #ccc;
        }

    </style>
</head>
<body>

    <div class="visitor-counter">
        Live Visitors: <span id="visitorCount">1,042</span>
    </div>

    <header>
        <h1>US Unit Converter Pro</h1>
        <p>Instant, accurate conversions for everyday measurements.</p>
    </header>

    <div class="container">
        
        <div class="card">
            <h3>Length & Distance</h3>
            <input type="number" id="lengthInput" placeholder="Enter value..." oninput="calculate('length')" value="1">
            <div class="input-group">
                <select id="lengthFrom" onchange="calculate('length')">
                    <option value="mile">Miles (mi)</option>
                    <option value="yard">Yards (yd)</option>
                    <option value="foot">Feet (ft)</option>
                    <option value="inch">Inches (in)</option>
                    <option value="kilometer">Kilometers (km)</option>
                    <option value="meter">Meters (m)</option>
                    <option value="centimeter">Centimeters (cm)</option>
                </select>
                <button class="swap-btn" onclick="swap('length')" title="Swap Units">⇄</button>
                <select id="lengthTo" onchange="calculate('length')">
                    <option value="kilometer">Kilometers (km)</option>
                    <option value="meter">Meters (m)</option>
                    <option value="centimeter">Centimeters (cm)</option>
                    <option value="mile">Miles (mi)</option>
                    <option value="yard">Yards (yd)</option>
                    <option value="foot">Feet (ft)</option>
                    <option value="inch">Inches (in)</option>
                </select>
            </div>
            <div class="result-display" id="lengthResult">0</div>
            <div class="conversion-rate" id="lengthRate">1 Mile = 1.60934 Kilometers</div>
        </div>

        <div class="card">
            <h3>Area</h3>
            <input type="number" id="areaInput" placeholder="Enter value..." oninput="calculate('area')" value="1">
            <div class="input-group">
                <select id="areaFrom" onchange="calculate('area')">
                    <option value="acre">Acres</option>
                    <option value="sq_mile">Sq Miles (mi²)</option>
                    <option value="sq_foot">Sq Feet (ft²)</option>
                    <option value="sq_inch">Sq Inches (in²)</option>
                    <option value="hectare">Hectares (ha)</option>
                    <option value="sq_meter">Sq Meters (m²)</option>
                </select>
                <button class="swap-btn" onclick="swap('area')" title="Swap Units">⇄</button>
                <select id="areaTo" onchange="calculate('area')">
                    <option value="hectare">Hectares (ha)</option>
                    <option value="sq_meter">Sq Meters (m²)</option>
                    <option value="acre">Acres</option>
                    <option value="sq_mile">Sq Miles (mi²)</option>
                    <option value="sq_foot">Sq Feet (ft²)</option>
                    <option value="sq_inch">Sq Inches (in²)</option>
                </select>
            </div>
            <div class="result-display" id="areaResult">0</div>
            <div class="conversion-rate" id="areaRate">1 Acre = 0.404686 Hectares</div>
        </div>

        <div class="card">
            <h3>Volume</h3>
            <input type="number" id="volumeInput" placeholder="Enter value..." oninput="calculate('volume')" value="1">
            <div class="input-group">
                <select id="volumeFrom" onchange="calculate('volume')">
                    <option value="us_gallon">Gallons (US gal)</option>
                    <option value="us_quart">Quarts (US qt)</option>
                    <option value="us_ounce">Fluid Ounces (fl oz)</option>
                    <option value="liter">Liters (L)</option>
                    <option value="milliliter">Milliliters (ml)</option>
                </select>
                <button class="swap-btn" onclick="swap('volume')" title="Swap Units">⇄</button>
                <select id="volumeTo" onchange="calculate('volume')">
                    <option value="liter">Liters (L)</option>
                    <option value="milliliter">Milliliters (ml)</option>
                    <option value="us_gallon">Gallons (US gal)</option>
                    <option value="us_quart">Quarts (US qt)</option>
                    <option value="us_ounce">Fluid Ounces (fl oz)</option>
                </select>
            </div>
            <div class="result-display" id="volumeResult">0</div>
            <div class="conversion-rate" id="volumeRate">1 Gallon = 3.78541 Liters</div>
        </div>

        <div class="card">
            <h3>Temperature</h3>
            <input type="number" id="tempInput" placeholder="Enter value..." oninput="calculateTemp()" value="32">
            <div class="input-group">
                <select id="tempFrom" onchange="calculateTemp()">
                    <option value="f">Fahrenheit (°F)</option>
                    <option value="c">Celsius (°C)</option>
                    <option value="k">Kelvin (K)</option>
                </select>
                <button class="swap-btn" onclick="swapTemp()" title="Swap Units">⇄</button>
                <select id="tempTo" onchange="calculateTemp()">
                    <option value="c">Celsius (°C)</option>
                    <option value="f">Fahrenheit (°F)</option>
                    <option value="k">Kelvin (K)</option>
                </select>
            </div>
            <div class="result-display" id="tempResult">0</div>
            <div class="conversion-rate" id="tempRate">32 °F = 0 °C</div>
        </div>

    </div>

    <script>
        // --- Conversion Rates (relative to a base unit) ---
        const rates = {
            length: {
                meter: 1,
                kilometer: 1000,
                centimeter: 0.01,
                inch: 0.0254,
                foot: 0.3048,
                yard: 0.9144,
                mile: 1609.344
            },
            area: {
                sq_meter: 1,
                hectare: 10000,
                sq_inch: 0.00064516,
                sq_foot: 0.092903,
                sq_mile: 2589988.11,
                acre: 4046.856
            },
            volume: {
                liter: 1,
                milliliter: 0.001,
                us_gallon: 3.78541,
                us_quart: 0.946352946,
                us_ounce: 0.0295735
            }
        };

        // --- Main Calculate Function (Length, Area, Volume) ---
        function calculate(type) {
            const val = parseFloat(document.getElementById(type + 'Input').value);
            const from = document.getElementById(type + 'From');
            const to = document.getElementById(type + 'To');
            const resultBox = document.getElementById(type + 'Result');
            const rateBox = document.getElementById(type + 'Rate');

            const fromVal = from.value;
            const toVal = to.value;
            const fromText = from.options[from.selectedIndex].text.split(' ')[0]; // Get clean text
            const toText = to.options[to.selectedIndex].text.split(' ')[0];

            if (isNaN(val)) {
                resultBox.innerText = "...";
                return;
            }

            // Math: (Input * FromRate) / ToRate
            const baseValue = val * rates[type][fromVal];
            const finalValue = baseValue / rates[type][toVal];
            
            // Single Unit Rate for the bottom text
            const singleUnitRate = (1 * rates[type][fromVal]) / rates[type][toVal];

            // Update UI
            resultBox.innerText = finalValue.toLocaleString('en-US', {maximumFractionDigits: 4}) + " " + toText;
            rateBox.innerText = `1 ${fromText} = ${singleUnitRate.toLocaleString('en-US', {maximumFractionDigits: 6})} ${toText}`;
        }

        // --- Temperature requires formulas, not just multiplication ---
        function calculateTemp() {
            const val = parseFloat(document.getElementById('tempInput').value);
            const from = document.getElementById('tempFrom');
            const to = document.getElementById('tempTo');
            const resultBox = document.getElementById('tempResult');
            const rateBox = document.getElementById('tempRate');

            const f = from.value;
            const t = to.value;
            const fromText = from.options[from.selectedIndex].text;
            const toText = to.options[to.selectedIndex].text;

            if (isNaN(val)) { resultBox.innerText = "..."; return; }

            let c;
            // Convert everything to Celsius first
            if (f === 'f') c = (val - 32) * 5/9;
            else if (f === 'k') c = val - 273.15;
            else c = val;

            let finalValue;
            // Convert Celsius to target
            if (t === 'f') finalValue = (c * 9/5) + 32;
            else if (t === 'k') finalValue = c + 273.15;
            else finalValue = c;

            resultBox.innerText = finalValue.toLocaleString('en-US', {maximumFractionDigits: 2});
            
            // Update rate text (Example: 1 °F -> °C)
            rateBox.innerText = `${val} ${fromText} = ${finalValue.toLocaleString('en-US', {maximumFractionDigits: 2})} ${toText}`;
        }

        // --- Swap Functions ---
        function swap(type) {
            const from = document.getElementById(type + 'From');
            const to = document.getElementById(type + 'To');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
            calculate(type);
        }

        function swapTemp() {
            const from = document.getElementById('tempFrom');
            const to = document.getElementById('tempTo');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
            calculateTemp();
        }

        // --- Simulated Visitor Counter ---
        // Note: Real counters on static pages require third-party APIs. 
        // This simulates a realistic local counter for demonstration.
        window.onload = function() {
            let count = localStorage.getItem('siteVisits');
            if (!count) count = Math.floor(Math.random() * 500) + 1000; // Starting random base
            count = parseInt(count) + 1;
            localStorage.setItem('siteVisits', count);
            document.getElementById('visitorCount').innerText = count.toLocaleString('en-US');

            // Initialize all calculations on load
            calculate('length');
            calculate('area');
            calculate('volume');
            calculateTemp();
        };
    </script>
</body>
</html>
