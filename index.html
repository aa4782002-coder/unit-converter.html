<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Easy Unit Converter | US Standard & Metric Tool</title>
    <meta name="description" content="Fast and free online unit converter for US Customary and Metric units. Convert length, area, volume, and temperature instantly.">
    <meta name="keywords" content="unit converter, inches to cm, fahrenheit to celsius, gallons to liters, miles to km, area converter, US measurement tools, fast conversion">
    <meta name="author" content="AA4782002-Coder">

    <style>
        :root {
            --us-blue: #002868;
            --us-red: #bf0a30;
            --light-gray: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Visitor Counter Style */
        .counter-box {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--us-blue);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 { color: var(--us-blue); margin-bottom: 5px; }
        .header p { color: #666; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 4px solid var(--us-red);
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--us-blue);
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .result {
            background: #eef7ff;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--us-red);
            border-radius: 5px;
            margin: 10px 0;
        }

        /* The requested conversion info text */
        .info-text {
            font-size: 0.85rem;
            color: #555;
            background: #fff9c4;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            border: 1px dashed #ffd54f;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="counter-box">Visitors: <span id="vCount">0</span></div>

    <div class="header">
        <h1>US Standard Unit Converter</h1>
        <p>Simple, Fast, and Accurate Conversions</p>
    </div>

    <div class="container">
        
        <div class="card">
            <h2>Length (Distance)</h2>
            <input type="number" id="lenInput" value="1" oninput="convertLen()">
            <select id="lenFrom" onchange="convertLen()">
                <option value="m">Meters (m)</option>
                <option value="yd">Yards (yd)</option>
                <option value="ft">Feet (ft)</option>
                <option value="in">Inches (in)</option>
            </select>
            <select id="lenTo" onchange="convertLen()">
                <option value="yd">Yards (yd)</option>
                <option value="m">Meters (m)</option>
                <option value="ft">Feet (ft)</option>
                <option value="in">Inches (in)</option>
            </select>
            <div class="result" id="lenRes">1.0936 yd</div>
            <div class="info-text" id="lenInfo">1 Meter = 1.0936 Yards</div>
        </div>

        <div class="card">
            <h2>Area</h2>
            <input type="number" id="areaInput" value="1" oninput="convertArea()">
            <select id="areaFrom" onchange="convertArea()">
                <option value="sqm">Sq Meters (m²)</option>
                <option value="acre">Acres</option>
                <option value="sqft">Sq Feet (ft²)</option>
            </select>
            <select id="areaTo" onchange="convertArea()">
                <option value="acre">Acres</option>
                <option value="sqm">Sq Meters (m²)</option>
                <option value="sqft">Sq Feet (ft²)</option>
            </select>
            <div class="result" id="areaRes">0.0002 Acres</div>
            <div class="info-text" id="areaInfo">1 Sq Meter = 0.000247 Acres</div>
        </div>

        <div class="card">
            <h2>Temperature</h2>
            <input type="number" id="tempInput" value="0" oninput="convertTemp()">
            <select id="tempFrom" onchange="convertTemp()">
                <option value="c">Celsius (°C)</option>
                <option value="f">Fahrenheit (°F)</option>
            </select>
            <select id="tempTo" onchange="convertTemp()">
                <option value="f">Fahrenheit (°F)</option>
                <option value="c">Celsius (°C)</option>
            </select>
            <div class="result" id="tempRes">32 °F</div>
            <div class="info-text" id="tempInfo">0 °C = 32 °F</div>
        </div>

    </div>

    <footer>
        &copy; 2026 Unit Converter Pro - Serving the US Community
    </footer>

    <script>
        // Conversion logic
        function convertLen() {
            const val = document.getElementById('lenInput').value;
            const from = document.getElementById('lenFrom').value;
            const to = document.getElementById('lenTo').value;
            
            const factors = { m: 1, yd: 1.09361, ft: 3.28084, in: 39.3701 };
            const res = (val / factors[from]) * factors[to];
            
            document.getElementById('lenRes').innerText = res.toFixed(4) + " " + to;
            document.getElementById('lenInfo').innerText = `1 ${from} = ${(factors[to]/factors[from]).toFixed(4)} ${to}`;
        }

        function convertArea() {
            const val = document.getElementById('areaInput').value;
            const from = document.getElementById('areaFrom').value;
            const to = document.getElementById('areaTo').value;
            
            const factors = { sqm: 1, acre: 0.000247105, sqft: 10.7639 };
            const res = (val / factors[from]) * factors[to];
            
            document.getElementById('areaRes').innerText = res.toFixed(4) + " " + to;
            document.getElementById('areaInfo').innerText = `1 ${from} = ${(factors[to]/factors[from]).toFixed(6)} ${to}`;
        }

        function convertTemp() {
            const val = parseFloat(document.getElementById('tempInput').value);
            const from = document.getElementById('tempFrom').value;
            const to = document.getElementById('tempTo').value;
            let res;

            if (from === to) res = val;
            else if (from === 'c') res = (val * 9/5) + 32;
            else res = (val - 32) * 5/9;

            document.getElementById('tempRes').innerText = res.toFixed(2) + " °" + to.toUpperCase();
            document.getElementById('tempInfo').innerText = `Formula: ${from==='c'?'(C×9/5)+32':'(F-32)×5/9'}`;
        }

        // Simple Visitor Counter (Session based)
        let visits = localStorage.getItem('vCount') || Math.floor(Math.random() * 2000);
        visits = parseInt(visits) + 1;
        localStorage.setItem('vCount', visits);
        document.getElementById('vCount').innerText = visits;
    </script>
</body>
</html>
